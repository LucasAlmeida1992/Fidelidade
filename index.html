<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas França Tatuador - Cartão Fidelidade</title>
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <img src="https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPOSITORIO/main/logoPrancheta-1Logo-Lucas-Franca-tatuador-pequena.svg" alt="Lucas França Tatuador" class="header-logo">
            <p>Cartão Fidelidade</p>
            <button class="btn-admin-toggle" id="btn-admin-toggle" onclick="abrirModalAdmin()" title="Painel Admin">⚙️</button>
        </header>

        <!-- TELA DE LOGIN / CADASTRO DA CARTEIRA -->
        <section id="sec-login" class="card-box">
            <form id="form-login" onsubmit="loginCliente(event)">
                <div class="input-group">
                    <label for="input-nome">Seu Nome:</label>
                    <input type="text" id="input-nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="input-whatsapp">WhatsApp (DDD + Número):</label>
                    <input type="tel" id="input-whatsapp" placeholder="Ex: 21999999999" pattern="[0-9]{10,11}" required>
                </div>

                <button type="submit" id="btn-entrar" class="btn-gold">Acessar Cartão</button>
            </form>
        </section>

        <!-- CARTÃO FIDELIDADE DO CLIENTE -->
        <section id="sec-cartao" class="card-box hidden">
            <div class="greeting-text">
                Olá, <strong id="cli-nome">Cliente</strong>!
            </div>

            <!-- GRID DOS CARIMBOS REDONDOS -->
            <div class="stamps-grid">
                <!-- Slot 1 -->
                <div class="stamp-slot" id="slot-1">
                    <div class="icon">🩸</div>
                    <div class="label">1ª Tattoo</div>
                </div>

                <!-- Slot 2 -->
                <div class="stamp-slot" id="slot-2">
                    <div class="icon">🩸</div>
                    <div class="label">2ª Tattoo</div>
                </div>

                <!-- Slot 3 (Recompensa) -->
                <div class="stamp-slot" id="slot-3">
                    <div class="icon">🎁</div>
                    <div class="label">Desconto</div>
                </div>
            </div>

            <!-- BANNER DE INFORMAÇÃO DO DESCONTO -->
            <div class="discount-banner">
                <span class="discount-label">Status da Recompensa</span>
                <h3 id="dispDesconto">Faça 2 tattoos e ganhe 10% OFF na 3ª!</h3>
            </div>

            <!-- AÇÕES DO CLIENTE / TATUADOR -->
            <button class="btn-gold" id="btn-adicionar-carimbo" onclick="adicionarCarimboComSenha()">+ Adicionar Carimbo</button>
            <button class="btn-link" onclick="sairCliente()">Sair da minha conta</button>
        </section>

        <!-- PAINEL ADMIN (OCULTO POR PADRÃO) -->
        <section id="sec-admin" class="admin-panel hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 class="admin-title" style="margin: 0;">Painel de Controle</h2>
                <button class="btn-sm" onclick="fecharAdmin()">Fechar ✕</button>
            </div>

            <div class="input-group">
                <input type="text" id="admin-search" placeholder="Buscar cliente por nome ou WhatsApp..." oninput="filtrarClientes()">
            </div>

            <div class="admin-client-list" id="admin-client-list">
                <!-- Lista de clientes renderizada dinamicamente via JS -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
