<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas França Tattoo - Cartão Fidelidade VIP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fontes Inter + UnifrakturMaguntia para a logo tattoo -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- HEADER EXACTO DA IMAGEM -->
        <header class="app-header">
            <div class="logo-title">Lucas França</div>
            <div class="logo-subtitle">Tattoo</div>
            <div class="vip-tag">Cartão Fidelidade VIP</div>
            <button id="btn-admin-toggle" class="btn-icon" title="Painel Admin">⚙️</button>
        </header>

        <!-- SEÇÃO DE LOGIN -->
        <section id="sec-login" class="card-section">
            <form id="form-login">
                <div class="input-group">
                    <label for="cli-phone">SEU WHATSAPP (COM DDD)</label>
                    <input type="tel" id="cli-phone" placeholder="2145636534" required>
                </div>
                <div class="input-group">
                    <label for="cli-name">SEU NOME COMPLETO</label>
                    <input type="text" id="cli-name" placeholder="Digite seu nome" required>
                </div>
                <button type="submit" id="btn-acessar" class="btn-primary">VER MEU CARTÃO</button>
            </form>
        </section>

        <!-- SEÇÃO DO CARTÃO FIDELIDADE (MANTÉM INTEGRADO COM SEU JS) -->
        <section id="sec-cartao" class="card-section hidden">
            <div class="client-welcome">
                <span>Olá, <strong id="disp-nome">Cliente</strong>!</span>
                <button id="btn-sair" class="btn-text">Sair</button>
            </div>

            <div class="loyalty-card">
                <div class="stamps-grid">
                    <div class="stamp-slot" id="slot-1">
                        <span class="emoji-icon"></span>
                        <span class="label">1ª Tattoo</span>
                    </div>

                    <div class="stamp-slot" id="slot-2">
                        <span class="emoji-icon"></span>
                        <span class="label">2ª Tattoo</span>
                    </div>

                    <div class="stamp-slot reward-slot" id="slot-3">
                        <span class="emoji-icon">🎁</span>
                        <span class="label">3ª Tattoo • 10% OFF</span>
                    </div>
                </div>

                <div id="disp-desconto" class="reward-message">
                    Faça sua 1ª tattoo para iniciar o cartão!
                </div>
            </div>

            <button type="button" id="btn-abrir-resgate" class="btn-secondary">✨ Resgatar Carimbo (Código)</button>

            <div class="card-footer-info">
                <p>📍 Av. Dom Hélder Câmara - Pilares, Rio de Janeiro</p>
            </div>
        </section>

        <!-- MODAL DE RESGATE -->
        <div id="modal-resgate" class="modal-overlay hidden">
            <div class="modal-content">
                <h3>Resgatar Carimbo</h3>
                <p>Digite o código de 4 dígitos fornecido pelo tatuador:</p>
                <input type="text" id="input-codigo-resgate" maxlength="4" placeholder="0000" autocomplete="off">
                <div class="modal-actions">
                    <button type="button" id="btn-cancelar-resgate" class="btn-text">Cancelar</button>
                    <button type="button" id="btn-confirmar-resgate" class="btn-primary">Confirmar</button>
                </div>
            </div>
        </div>

        <!-- PAINEL ADMIN -->
        <section id="sec-admin" class="card-section hidden admin-panel">
            <div class="admin-header">
                <h2 class="admin-title">PAINEL DO TATUADOR</h2>
                <button id="btn-fechar-admin" class="btn-close">✕</button>
            </div>

            <div class="input-group">
                <label for="admin-search">Buscar Cliente</label>
                <input type="text" id="admin-search" placeholder="Buscar por Nome ou WhatsApp...">
            </div>

            <div id="lista-clientes-admin" class="admin-client-list"></div>

            <button class="btn-sm btn-full" id="btn-fechar-admin-bottom">Fechar Painel</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
